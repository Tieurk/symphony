<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Mon premier orchestre, maquette</title>
<style>
  /* ==========================================================================
     MAQUETTE FIXE. Rien ne fonctionne ici, et c'est voulu : c'est la mise en
     page qu'on juge, pas le jeu. Aucun son, aucune interaction, aucun etat.
     Le seul JavaScript de la page injecte le sprite des 13 instruments et
     ecrit les jetons depuis src/instruments.js, pour qu'il n'existe qu'un seul
     jeu de dessins dans le depot. Les trois boutons du haut sont un
     interrupteur CSS (des radios), pas du code : ils changent l'etat de la
     scene pour que tu voies les trois cas du cahier des charges sans
     recharger.
     Bascule au point de rupture : au dessus de 900 px la mise en page paysage
     (iPad, Mac), en dessous la mise en page portrait (iPhone).
     ========================================================================== */

  :root {
    --nuit: #141b2e;
    --nuit-clair: #1e2740;
    --bord: #33405e;
    --texte: #f5e9d7;
    --doux: #9fb0d0;
    --accent: #f2a65a;
    --bois: #d9b382;
    --bois-ombre: #bd9260;
    --rideau: #a63d40;
    --rideau-sombre: #7d2b2e;
    --essai: 38px;          /* la barre d'essai, qui ne fait pas partie de l'app */
    --jeton: 68px;          /* cible tactile, plancher a 64 px */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--nuit); color: var(--texte);
    font: 14px/1.35 -apple-system, system-ui, sans-serif;
    padding-top: env(safe-area-inset-top);
  }

  /* --- la barre d'essai, volontairement laide pour qu'on ne la confonde pas
         avec l'app --- */
  .essai {
    height: var(--essai); display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: #0b0f1a; border-bottom: 1px solid var(--bord);
    font: 11px ui-monospace, Menlo, monospace; color: var(--doux);
  }
  .essai b { color: var(--texte); font-weight: 600; }
  .etat { position: absolute; opacity: 0; pointer-events: none; }
  .essai label {
    padding: 5px 9px; border: 1px solid var(--bord); border-radius: 6px;
    cursor: pointer; white-space: nowrap;
  }
  #e-vide:checked  ~ .essai label[for="e-vide"],
  #e-trois:checked ~ .essai label[for="e-trois"],
  #e-plein:checked ~ .essai label[for="e-plein"] {
    background: var(--accent); color: #22160c; border-color: var(--accent); font-weight: 700;
  }

  /* ======================= LA COQUE DE L'APP ======================= */
  .app {
    height: calc(100dvh - var(--essai) - env(safe-area-inset-top));
    display: grid; gap: 8px; padding: 8px;
    padding-left: calc(8px + env(safe-area-inset-left));
    padding-right: calc(8px + env(safe-area-inset-right));
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    grid-template-areas: "ctrl" "scene" "res";
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  @supports not (height: 100dvh) {
    .app { height: calc(100vh - var(--essai) - env(safe-area-inset-top)); }
  }

  /* ======================= CONTROLES ======================= */
  .ctrl {
    grid-area: ctrl; background: var(--nuit-clair); border: 1px solid var(--bord);
    border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px;
  }
  .rangee { display: flex; align-items: center; gap: 10px; min-width: 0; }

  /* le selecteur de morceau : des vignettes colorees, reconnaissables sans lire */
  .morceaux {
    display: flex; gap: 6px; min-width: 0; flex: 1 1 auto;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, #000 0 88%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 0 88%, transparent 100%);
  }
  .morceaux::-webkit-scrollbar { display: none; }
  .morceau { scroll-snap-align: start; }
  .morceau {
    width: var(--jeton); height: var(--jeton); flex: 0 0 auto;
    border-radius: 12px; border: 3px solid transparent; position: relative;
    display: flex; align-items: flex-end; padding: 5px; overflow: hidden;
  }
  .morceau span {
    font-size: 9px; line-height: 1.1; color: #22160c; font-weight: 700;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .morceau.choisi { border-color: var(--texte); }
  .morceau.choisi::after {
    content: ""; position: absolute; inset: auto 5px 100% auto;
  }

  /* les boutons ronds : play, suivant, engrenage */
  .rond {
    width: var(--jeton); height: var(--jeton); flex: 0 0 auto;
    border-radius: 50%; border: 1px solid var(--bord); background: #2b3654;
    display: grid; place-items: center; color: var(--texte);
  }
  .rond svg { width: 46%; height: 46%; fill: currentColor; }
  .rond.play {
    width: calc(var(--jeton) + 20px); height: calc(var(--jeton) + 20px);
    background: var(--accent); border-color: #c97f33; color: #22160c;
  }
  .rond.engrenage { background: transparent; color: var(--doux); }

  /* curseurs : tempo aimante sur trois reperes, et volume */
  .curseur { flex: 1 1 130px; min-width: 110px; display: flex; flex-direction: column; gap: 2px; }
  .piste {
    height: 18px; border-radius: 9px; background: #2b3654;
    border: 1px solid var(--bord); position: relative;
  }
  .piste i {
    position: absolute; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border-radius: 50%; background: var(--texte); border: 3px solid var(--accent);
  }
  .reperes { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
  .reperes svg {
    width: 30px; height: 30px;
    --base: var(--doux); --clair: #c3d0e6; --sombre: #5b6a8a; --fil: var(--texte);
  }
  /* le repere courant, en accent */
  .reperes .actif { --base: var(--accent); --clair: #ffd49a; --sombre: #a8681f; }
  .ligne-volume { display: flex; align-items: center; gap: 8px; flex: 1 1 120px; min-width: 0; }
  .ligne-volume svg { width: 24px; height: 24px; flex: 0 0 auto; fill: var(--doux); }

  /* ======================= LA SCENE ======================= */
  .scene {
    grid-area: scene; position: relative; overflow: hidden; border-radius: 14px;
    background: linear-gradient(180deg, var(--bois) 0%, var(--bois-ombre) 100%);
    display: grid; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    align-content: stretch; justify-items: stretch; padding: 30px 40px 12px;
  }
  /* projecteurs, deux cones de lumiere depuis le haut */
  .scene::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(198deg, rgba(255,245,215,.38) 0 14%, transparent 42%),
      linear-gradient(162deg, rgba(255,245,215,.38) 0 14%, transparent 42%);
  }
  /* rideaux lateraux */
  .rideau-g, .rideau-d {
    position: absolute; top: 0; bottom: 0; width: 34px; z-index: 2;
    background: repeating-linear-gradient(90deg,
      var(--rideau) 0 8px, var(--rideau-sombre) 8px 16px);
  }
  .rideau-g { left: 0; border-radius: 14px 0 0 14px; }
  .rideau-d { right: 0; border-radius: 0 14px 14px 0; }
  /* frise haute, festonnee */
  .frise {
    position: absolute; left: 0; right: 0; top: 0; height: 26px; z-index: 3;
    background: var(--rideau);
    -webkit-mask-image: radial-gradient(14px 13px at 14px 100%, transparent 98%, #000 100%);
    mask-image: radial-gradient(14px 13px at 14px 100%, transparent 98%, #000 100%);
    -webkit-mask-size: 28px 100%; mask-size: 28px 100%;
    -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x;
  }
  .places {
    display: grid; gap: 10px; width: 100%; height: 100%;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 120px));
    align-content: center; position: relative; z-index: 1;
  }
  .place {
    width: 100%; height: 100%; min-width: 64px; border-radius: 16px;
    border: 2px dashed rgba(90,50,20,.38); background: rgba(255,255,255,.14);
    display: grid; place-items: center; padding: 6px;
  }
  .place svg { width: 100%; height: 100%; }

  /* Ecran court : on rend a la scene les 20 px de marge qu'elle gaspille,
     sans quoi l'emplacement tombe sous la cible tactile de 64 px. */
  @media (max-height: 700px) {
    :root { --jeton: 64px; }
    .rond.play { width: calc(var(--jeton) + 12px); height: calc(var(--jeton) + 12px); }
    .ctrl { gap: 6px; }
    .frise { height: 22px; }
    .scene { padding: 25px 36px 8px; }
    .places { gap: 8px; }
  }

  /* ======================= LA RESERVE ======================= */
  .res-paysage { display: none; }
  .res-portrait {
    grid-area: res; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px;
    background: var(--nuit-clair); border: 1px solid var(--bord);
    border-radius: 14px; padding: 8px;
  }
  .jeton {
    aspect-ratio: 1; min-width: 64px; min-height: 64px; border-radius: 13px;
    background: #2b3654; border: 1px solid var(--bord);
    display: grid; place-items: center; padding: 6px;
  }
  .jeton svg { width: 100%; height: 100%; }

  /* ======================= PAYSAGE ======================= */
  @media (min-width: 900px) {
    :root { --jeton: 84px; }
    .app {
      grid-template-areas: "ctrl ctrl ctrl" "resg scene resd";
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .ctrl { flex-direction: row; align-items: center; gap: 16px; padding: 10px 14px; }
    .rangee { display: contents; }
    .rond.engrenage { order: 2; }       /* le DOM le met en rangee 1, ici il finit la ligne */
    .morceaux { flex: 1 1 auto; }       /* absorbe le mou : plus de morceaux visibles */
    .curseur { flex: 0 0 200px; }
    .ligne-volume { flex: 0 0 155px; }
    .res-portrait { display: none; }
    .res-paysage {
      display: grid; gap: 8px; align-content: start; justify-items: center;
      grid-template-columns: minmax(64px, auto);
      grid-template-rows: repeat(7, minmax(64px, 1fr));
      background: var(--nuit-clair); border: 1px solid var(--bord);
      border-radius: 14px; padding: 8px;
    }
    .res-paysage .jeton {
      height: 100%; width: auto; aspect-ratio: 1; max-height: 92px; min-width: 64px;
    }
    .res-a { grid-area: resg; }
    .res-b { grid-area: resd; }
    .scene { padding: 34px 46px 20px; }

    /* la scene en demi-cercle, voir docs/cadrage.md section 4.5 */
    .places {
      display: block; position: relative;
      --place: clamp(64px, 15%, 150px);
    }
    .place {
      position: absolute; width: var(--place); height: auto; aspect-ratio: 1;
      transform: translate(-50%, -50%); min-width: 64px;
    }
    .place:nth-child(1) { left:  8%; top: 82%; }
    .place:nth-child(2) { left: 24.8%; top: 46%; }
    .place:nth-child(3) { left: 41.6%; top: 28%; }
    .place:nth-child(4) { left: 58.4%; top: 28%; }
    .place:nth-child(5) { left: 75.2%; top: 46%; }
    .place:nth-child(6) { left: 92%; top: 82%; }
  }

  /* Pas assez de hauteur pour sept jetons de 64 px en une colonne : deux
     colonnes par cote. C'est le cas de l'iPad en paysage dans Safari, ou la
     barre d'adresse mange une centaine de pixels. */
  @media (min-width: 900px) and (max-height: 700px) {
    .res-paysage {
      grid-template-columns: repeat(2, minmax(64px, auto));
      grid-template-rows: repeat(4, minmax(64px, 1fr));
    }
    .res-paysage .jeton { max-height: 76px; }
  }

  /* ======================= LES TROIS ETATS, EN CSS PUR =======================
     Poser un instrument, c'est le faire disparaitre de la reserve et apparaitre
     sur la scene. La place qu'il laisse dans la reserve reste vide plutot que
     de se refermer : un enfant de 6 ans retrouve son instrument a la meme
     position, c'est plus important que de gagner de la place.
     ========================================================================= */
  /* scene vide */
  #e-vide:checked ~ .app .place > svg { visibility: hidden; }
  /* scene a trois : violon, tuba, batterie, le trio de reference de CLAUDE.md */
  #e-trois:checked ~ .app .place:nth-child(n+4) > svg { visibility: hidden; }
  #e-trois:checked ~ .app .jeton[data-pose="3"] > svg { visibility: hidden; }
  /* scene pleine */
  #e-plein:checked ~ .app .jeton[data-pose] > svg { visibility: hidden; }

  /* l'emplacement occupe devient un panneau franc, le libre reste en pointilles */
  #e-trois:checked ~ .app .place:nth-child(-n+3),
  #e-plein:checked ~ .app .place {
    border-style: solid; border-color: rgba(90,50,20,.22); background: rgba(255,255,255,.3);
  }
  /* le jeton vide de la reserve : le creux reste visible */
  #e-trois:checked ~ .app .jeton[data-pose="3"],
  #e-plein:checked ~ .app .jeton[data-pose] {
    background: #212b47; border-style: dashed;
  }
</style>
</head>
<body>

<!-- les trois radios pilotent l'etat de la scene, en CSS, sans une ligne de JS -->
<input class="etat" type="radio" name="etat" id="e-vide">
<input class="etat" type="radio" name="etat" id="e-trois" checked>
<input class="etat" type="radio" name="etat" id="e-plein">

<div class="essai">
  <b>Maquette</b> &middot; scène :
  <label for="e-vide">vide</label>
  <label for="e-trois">3 instruments</label>
  <label for="e-plein">pleine, 6</label>
</div>

<div class="app">

  <header class="ctrl">

    <!-- rangee 1 : le selecteur de morceau, la fleche suivant (le PLAY du
         jouet, qui enchaine les morceaux), et l'engrenage de la zone parent -->
    <div class="rangee">
      <div class="morceaux">
        <div class="morceau choisi" style="background:#f2a65a"><span>Ah&nbsp;! vous dirai-je</span></div>
        <div class="morceau" style="background:#7fc8a9"><span>Alouette</span></div>
        <div class="morceau" style="background:#6fb3d8"><span>Row Your Boat</span></div>
        <div class="morceau" style="background:#d98ba8"><span>Fr&egrave;re Jacques</span></div>
        <div class="morceau" style="background:#b98bd9"><span>Au clair de la lune</span></div>
      </div>
      <div class="rond" aria-label="morceau suivant">
        <svg viewBox="0 0 24 24"><path d="M5 4l11 8-11 8z"/><path d="M18 4h2v16h-2z"/></svg>
      </div>
      <div class="rond engrenage" aria-label="zone parent, appui long 2 s">
        <svg viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5M10.6 2h2.8l.5 2.5 2.2 1.3 2.4-.9 1.4 2.4-1.9 1.7v2.5l1.9 1.7-1.4 2.4-2.4-.9-2.2 1.3-.5 2.5h-2.8l-.5-2.5-2.2-1.3-2.4.9-1.4-2.4 1.9-1.7v-2.5L4.1 7.3l1.4-2.4 2.4.9 2.2-1.3z"/></svg>
      </div>
    </div>

    <!-- rangee 2 : le gros bouton de lecture et le tempo, aimante sur trois
         reperes illustres : tortue, noire, lapin, comme le veut le cadrage
         section 4.2. Dessines, pas des emoji, dont le rendu varie selon
         l'appareil. En phase 1 ils seront tapables, avec une zone sensible de
         64 px autour d'un dessin de 30. -->
    <div class="rangee">
      <div class="rond play" aria-label="lecture">
        <svg viewBox="0 0 24 24"><path d="M6 3l16 9-16 9z"/></svg>
      </div>
      <div class="curseur">
        <div class="piste"><i style="left:50%"></i></div>
        <div class="reperes">
          <svg aria-label="lent"><use href="#r-lent"/></svg>
          <svg class="actif" aria-label="normal"><use href="#r-normal"/></svg>
          <svg aria-label="rapide"><use href="#r-rapide"/></svg>
        </div>
      </div>
    </div>

    <!-- rangee 3 : le volume, sur toute la largeur en portrait. A deux
         curseurs sur une meme ligne de telephone, chacun tombait a 5 cm. -->
    <div class="rangee">
      <div class="ligne-volume">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-5v16l-5-5H4z"/><path d="M16 8a5 5 0 0 1 0 8v-2a3 3 0 0 0 0-4z"/></svg>
        <div class="piste" style="flex:1"><i style="left:72%"></i></div>
      </div>
    </div>

  </header>

  <div class="scene">
    <div class="rideau-g"></div>
    <div class="rideau-d"></div>
    <div class="frise"></div>
    <div class="places" id="places"></div>
  </div>

  <div class="res-paysage res-a" id="res-a"></div>
  <div class="res-paysage res-b" id="res-b"></div>
  <div class="res-portrait" id="res-portrait"></div>

</div>

<script type="module">
  // Le seul JavaScript de la page : injecter le sprite et ecrire les jetons.
  // Aucune interaction, aucun son, aucun etat. Tout ce qui bouge est en CSS.
  import { INSTRUMENTS, injecteSprite, instrument } from "../src/instruments.js";
  injecteSprite();

  // L'ordre des 6 emplacements de la maquette. Les trois premiers sont le trio
  // de reference de CLAUDE.md, celui qui doit sonner comme un vrai arrangement.
  const SUR_SCENE = ["violon", "tuba", "batterie", "flute", "piano", "cymbales"];

  const dessin = (id) => {
    const i = instrument(id);
    return `<svg class="f-${i.famille}"><use href="#i-${id}"/></svg>`;
  };

  document.getElementById("places").innerHTML = SUR_SCENE
    .map((id) => `<div class="place">${dessin(id)}</div>`).join("");

  // data-pose dit a quel etat le jeton quitte la reserve : "3" pour le trio,
  // "6" pour ceux qui ne partent qu'a scene pleine.
  const jeton = (i) => {
    const rang = SUR_SCENE.indexOf(i.id);
    const pose = rang < 0 ? "" : rang < 3 ? ' data-pose="3"' : ' data-pose="6"';
    return `<div class="jeton"${pose} title="${i.nom}">${dessin(i.id)}</div>`;
  };

  // Paysage : deux colonnes laterales, coupees sur une frontiere de famille
  // et pas au milieu du tas. Cordes et bois a gauche (6), cuivres, claviers,
  // vent et percussions a droite (7).
  const GAUCHE = ["cordes", "bois"];
  const html = (liste) => liste.map(jeton).join("");
  document.getElementById("res-a").innerHTML =
    html(INSTRUMENTS.filter((i) => GAUCHE.includes(i.famille)));
  document.getElementById("res-b").innerHTML =
    html(INSTRUMENTS.filter((i) => !GAUCHE.includes(i.famille)));
  // Portrait : les 13 en grille, meme ordre.
  document.getElementById("res-portrait").innerHTML = html(INSTRUMENTS);

  window.pret = true;
</script>

</body>
</html>
