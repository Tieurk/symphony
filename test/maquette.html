<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Mon premier orchestre, maquette</title>
<link rel="stylesheet" href="../src/app.css">
<style>
  /* ==========================================================================
     MAQUETTE FIXE. La mise en page vient de src/app.css, la MEME feuille que
     l'app : recopier ces 360 lignes ici les ferait diverger au premier reglage.
     Cette page ne garde en propre que ce qui n'existe pas dans l'app : sa barre
     d'essai, et les trois etats de scene en CSS pur.

     Rien ne fonctionne ici, et c'est voulu : aucun son, aucune interaction.
     C'est la mise en page qu'on juge, et elle est validee. Les trois boutons
     du haut sont un interrupteur CSS (des radios), pas du code.

     Bascule au point de rupture : au dessus de 900 px la mise en page paysage
     (iPad, Mac), en dessous la mise en page portrait (iPhone).
     ========================================================================== */

  :root { --essai: 38px; }   /* l'app vaut 0, la barre d'essai prend la place */

  /* --- la barre d'essai, volontairement laide pour qu'on ne la confonde pas
         avec l'app --- */
  .essai {
    height: var(--essai); display: flex; align-items: center; gap: 6px;
    padding: 0 10px; background: #0b0f1a; border-bottom: 1px solid var(--bord);
    font: 11px ui-monospace, Menlo, monospace; color: var(--doux);
  }
  .essai b { color: var(--texte); font-weight: 600; }
  .etat { position: absolute; opacity: 0; pointer-events: none; }
  .essai label {
    padding: 5px 9px; border: 1px solid var(--bord); border-radius: 6px;
    cursor: pointer; white-space: nowrap;
  }
  #e-vide:checked  ~ .essai label[for="e-vide"],
  #e-trois:checked ~ .essai label[for="e-trois"],
  #e-plein:checked ~ .essai label[for="e-plein"] {
    background: var(--accent); color: #22160c; border-color: var(--accent); font-weight: 700;
  }

  /* ======================= LES TROIS ETATS, EN CSS PUR =======================
     Poser un instrument, c'est le faire disparaitre de la reserve et apparaitre
     sur la scene. La place qu'il laisse dans la reserve reste vide plutot que
     de se refermer : un enfant de 6 ans retrouve son instrument a la meme
     position, c'est plus important que de gagner de la place.
     ========================================================================= */
  /* scene vide */
  #e-vide:checked ~ .app .place > svg { visibility: hidden; }
  /* scene a trois : violon, tuba, batterie, le trio de reference de CLAUDE.md */
  #e-trois:checked ~ .app .place:nth-child(n+4) > svg { visibility: hidden; }
  #e-trois:checked ~ .app .jeton[data-pose="3"] > svg { visibility: hidden; }
  /* scene pleine */
  #e-plein:checked ~ .app .jeton[data-pose] > svg { visibility: hidden; }

  /* l'emplacement occupe devient un panneau franc, le libre reste en pointilles */
  #e-trois:checked ~ .app .place:nth-child(-n+3),
  #e-plein:checked ~ .app .place {
    border-style: solid; border-color: rgba(90,50,20,.22); background: rgba(255,255,255,.3);
  }
  /* le jeton vide de la reserve : le creux reste visible */
  #e-trois:checked ~ .app .jeton[data-pose="3"],
  #e-plein:checked ~ .app .jeton[data-pose] {
    background: #212b47; border-style: dashed;
  }
</style>
</head>
<body>

<!-- les trois radios pilotent l'etat de la scene, en CSS, sans une ligne de JS -->
<input class="etat" type="radio" name="etat" id="e-vide">
<input class="etat" type="radio" name="etat" id="e-trois" checked>
<input class="etat" type="radio" name="etat" id="e-plein">

<div class="essai">
  <b>Maquette</b> &middot; scène :
  <label for="e-vide">vide</label>
  <label for="e-trois">3 instruments</label>
  <label for="e-plein">pleine, 6</label>
</div>

<div class="app">

  <header class="ctrl">

    <!-- rangee 1 : le selecteur de morceau, la fleche suivant (le PLAY du
         jouet, qui enchaine les morceaux), et l'engrenage de la zone parent -->
    <div class="rangee">
      <div class="morceaux">
        <div class="morceau choisi" style="background:#f2a65a"><span>Ah&nbsp;! vous dirai-je</span></div>
        <div class="morceau" style="background:#7fc8a9"><span>Alouette</span></div>
        <div class="morceau" style="background:#6fb3d8"><span>Row Your Boat</span></div>
        <div class="morceau" style="background:#d98ba8"><span>Fr&egrave;re Jacques</span></div>
        <div class="morceau" style="background:#b98bd9"><span>Au clair de la lune</span></div>
      </div>
      <div class="rond" aria-label="morceau suivant">
        <svg viewBox="0 0 24 24"><path d="M5 4l11 8-11 8z"/><path d="M18 4h2v16h-2z"/></svg>
      </div>
      <div class="rond engrenage" aria-label="zone parent, appui long 2 s">
        <svg viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5A3.5 3.5 0 1 0 12 8.5M10.6 2h2.8l.5 2.5 2.2 1.3 2.4-.9 1.4 2.4-1.9 1.7v2.5l1.9 1.7-1.4 2.4-2.4-.9-2.2 1.3-.5 2.5h-2.8l-.5-2.5-2.2-1.3-2.4.9-1.4-2.4 1.9-1.7v-2.5L4.1 7.3l1.4-2.4 2.4.9 2.2-1.3z"/></svg>
      </div>
    </div>

    <!-- rangee 2 : le gros bouton de lecture et le tempo, aimante sur trois
         reperes illustres : tortue, noire, lapin, comme le veut le cadrage
         section 4.2. Dessines, pas des emoji, dont le rendu varie selon
         l'appareil. En phase 1 ils seront tapables, avec une zone sensible de
         64 px autour d'un dessin de 30. -->
    <div class="rangee">
      <div class="rond play" aria-label="lecture">
        <svg viewBox="0 0 24 24"><path d="M6 3l16 9-16 9z"/></svg>
      </div>
      <div class="curseur">
        <input type="range" class="piste" min="60" max="140" value="100" aria-label="tempo">
        <div class="reperes">
          <svg aria-label="lent"><use href="#r-lent"/></svg>
          <svg class="actif" aria-label="normal"><use href="#r-normal"/></svg>
          <svg aria-label="rapide"><use href="#r-rapide"/></svg>
        </div>
      </div>
    </div>

    <!-- rangee 3 : le volume, sur toute la largeur en portrait. A deux
         curseurs sur une meme ligne de telephone, chacun tombait a 5 cm. -->
    <div class="rangee">
      <div class="ligne-volume">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-5v16l-5-5H4z"/><path d="M16 8a5 5 0 0 1 0 8v-2a3 3 0 0 0 0-4z"/></svg>
        <input type="range" class="piste" min="0" max="100" value="80" aria-label="volume">
      </div>
    </div>

  </header>

  <div class="scene">
    <div class="rideau-g"></div>
    <div class="rideau-d"></div>
    <div class="frise"></div>
    <div class="places" id="places"></div>
  </div>

  <div class="res-paysage res-a" id="res-a"></div>
  <div class="res-paysage res-b" id="res-b"></div>
  <div class="res-portrait" id="res-portrait"></div>

</div>

<script type="module">
  // Le seul JavaScript de la page : injecter le sprite et ecrire les jetons.
  // Aucune interaction, aucun son, aucun etat. Tout ce qui bouge est en CSS.
  import { INSTRUMENTS, injecteSprite, instrument } from "../src/instruments.js";
  injecteSprite();

  // L'ordre des 6 emplacements de la maquette. Les trois premiers sont le trio
  // de reference de CLAUDE.md, celui qui doit sonner comme un vrai arrangement.
  const SUR_SCENE = ["violon", "tuba", "batterie", "flute", "piano", "cymbales"];

  const dessin = (id) => {
    const i = instrument(id);
    return `<svg class="f-${i.famille}"><use href="#i-${id}"/></svg>`;
  };

  document.getElementById("places").innerHTML = SUR_SCENE
    .map((id) => `<div class="place">${dessin(id)}</div>`).join("");

  // data-pose dit a quel etat le jeton quitte la reserve : "3" pour le trio,
  // "6" pour ceux qui ne partent qu'a scene pleine.
  const jeton = (i) => {
    const rang = SUR_SCENE.indexOf(i.id);
    const pose = rang < 0 ? "" : rang < 3 ? ' data-pose="3"' : ' data-pose="6"';
    return `<div class="jeton"${pose} title="${i.nom}">${dessin(i.id)}</div>`;
  };

  // Paysage : deux colonnes laterales, coupees sur une frontiere de famille
  // et pas au milieu du tas. Cordes et bois a gauche (6), cuivres, claviers,
  // vent et percussions a droite (7).
  const GAUCHE = ["cordes", "bois"];
  const html = (liste) => liste.map(jeton).join("");
  document.getElementById("res-a").innerHTML =
    html(INSTRUMENTS.filter((i) => GAUCHE.includes(i.famille)));
  document.getElementById("res-b").innerHTML =
    html(INSTRUMENTS.filter((i) => !GAUCHE.includes(i.famille)));
  // Portrait : les 13 en grille, meme ordre.
  document.getElementById("res-portrait").innerHTML = html(INSTRUMENTS);

  window.pret = true;
</script>

</body>
</html>
